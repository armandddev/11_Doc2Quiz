version: "3.9"

services:
  mongo:
    image: mongo:7-jammy
    container_name: mongo_Doc2Quiz
    restart: unless-stopped
    environment:
       MONGO_INITDB_ROOT_USERNAME: app_user
       MONGO_INITDB_ROOT_PASSWORD: app_secret
       MONGO_INITDB_DATABASE: app_db
    volumes:
      - mongo_data_Doc2Quiz:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    

 
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sae_Doc2Quiz
    command: python src/Doc2Quiz/ui_gradio.py
    ports:
      - "7860:7860"
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=app_db
      - MONGO_USER=app_user
      - MONGO_PASSWORD=app_secret
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/app/data
      - ./src/Doc2Quiz:/app/src/Doc2Quiz
    depends_on:
      mongo:
        condition: service_healthy
      # Cas ou on utilise Ollama en local
  #     ollama:
  #       condition: service_healthy

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama_Doc2Quiz
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12

  mongo-express:
      image: mongo-express:latest
      container_name: mongo_express_Doc2Quiz
      restart: unless-stopped
      ports:
        - "8081:8081"
      environment:
        ME_CONFIG_MONGODB_ADMINUSERNAME: app_user
        ME_CONFIG_MONGODB_ADMINPASSWORD: app_secret
        ME_CONFIG_MONGODB_URL: mongodb://app_user:app_secret@mongo:27017/
        ME_CONFIG_BASICAUTH: "false"
      depends_on:
        mongo:
          condition: service_healthy

volumes:
  mongo_data_Doc2Quiz:
  ollama_data:
