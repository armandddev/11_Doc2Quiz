version: "3.9"
services:
  pg:
    image: postgres:16-alpine
    container_name: pg_Doc2Quiz
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_secret
      POSTGRES_DB: app_db
    volumes:
      - pg_data_Doc2Quiz:/var/lib/postgresql/data
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sae_Doc2Quiz
    ports: ["7860:7860"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src/Doc2Quiz:/app/src/Doc2Quiz
    depends_on:
      - pg
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 1g
    restart: unless-stopped
volumes:
  ollama_data:
  pg_data_Doc2Quiz: