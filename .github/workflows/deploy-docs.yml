name: Deploy Doc

on:
  push:
    branches: [ '**' ]

jobs:
  deploy-doc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Pandoc & LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-extra texlive-xetex

      - name: Générer le PDF complet
        run: |
          pandoc \
            docs/user-guide/introduction.md \
            docs/user-guide/fonctionnalites/00-inscription.md \
            docs/user-guide/fonctionnalites/01-connexion-compte.md \
            docs/user-guide/fonctionnalites/02-creation-qcm.md \
            docs/user-guide/fonctionnalites/03-entrainement.md \
            docs/user-guide/fonctionnalites/04-profil.md \
            docs/user-guide/faq.md \
            -o docs/user-guide/documentation-utilisateur.pdf \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=2 \
            -V geometry:margin=2.5cm \
            -V lang=fr-FR \
            -V toc-title:"Table des matières"

      - name: Configurer le template Jekyll
        run: |
          cat > docs/user-guide/_config.yml << 'EOF'
          title: Documentation Doc2Quiz
          description: Documentation utilisateur complète
          remote_theme: just-the-docs/just-the-docs
          
          search_enabled: true
          heading_anchors: true

          plugins:
            - jekyll-remote-theme
          EOF

          cat > docs/user-guide/index.md << 'EOF'
          layout: default
          title: Accueil
          nav_order: 1

          Bienvenue sur la documentation en ligne de l'application **Doc2Quiz**.

          [Télécharger la version PDF complète](documentation-utilisateur.pdf){: .btn .btn-green }

          Utilisez le menu latéral pour naviguer à travers les différentes sections du guide.
          EOF

          sed -i '1s/^/---\nlayout: default\ntitle: Introduction\nnav_order: 2\n---\n\n/' docs/user-guide/introduction.md
          sed -i '1s/^/---\nlayout: default\ntitle: FAQ\nnav_order: 4\n---\n\n/' docs/user-guide/faq.md

          cat > docs/user-guide/fonctionnalites/index.md << 'EOF'
          layout: default
          title: Fonctionnalités
          nav_order: 3
          has_children: true

          Retrouvez ici tous les guides détaillés par fonctionnalité.
          EOF

          sed -i '1s/^/---\nlayout: default\ntitle: Inscription\nparent: Fonctionnalités\nnav_order: 1\n---\n\n/' docs/user-guide/fonctionnalites/00-inscription.md
          sed -i '1s/^/---\nlayout: default\ntitle: Connexion au compte\nparent: Fonctionnalités\nnav_order: 2\n---\n\n/' docs/user-guide/fonctionnalites/01-connexion_compte.md
          sed -i '1s/^/---\nlayout: default\ntitle: Création de QCM\nparent: Fonctionnalités\nnav_order: 3\n---\n\n/' docs/user-guide/fonctionnalites/02-creation-qcm.md
          sed -i '1s/^/---\nlayout: default\ntitle: Entraînement\nparent: Fonctionnalités\nnav_order: 4\n---\n\n/' docs/user-guide/fonctionnalites/03-entrainement.md
          sed -i '1s/^/---\nlayout: default\ntitle: Gestion du profil\nparent: Fonctionnalités\nnav_order: 5\n---\n\n/' docs/user-guide/fonctionnalites/04-profil.md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/user-guide